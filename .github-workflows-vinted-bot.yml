name: Vinted Deal Finder

on:
  schedule:
    # Esegui ogni 5 minuti
    - cron: '*/5 * * * *'

  # Permette esecuzione manuale dalla tab Actions
  workflow_dispatch:

jobs:
  find-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 📂 Restore cache files
      id: cache-restore
      uses: actions/cache/restore@v4
      with:
        path: |
          notified_deals.json
          bot_stats.json
        key: vinted-cache-${{ github.run_number }}
        restore-keys: |
          vinted-cache-

    - name: 🔥 Run Vinted Bot
      env:
        # OBBLIGATORIO: Configura questo secret!
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

        # OPZIONALI: Personalizzazione ricerca
        SEARCH_QUERY: ${{ secrets.SEARCH_QUERY }}
        MAX_PRICE: ${{ secrets.MAX_PRICE }}
        MIN_PRICE: ${{ secrets.MIN_PRICE }}
        MAX_ITEMS: ${{ secrets.MAX_ITEMS }}
      run: |
        python vinted_bot.py

    - name: 💾 Save cache files
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          notified_deals.json
          bot_stats.json
        key: vinted-cache-${{ github.run_number }}

    - name: 📤 Commit cache updates
      if: always()
      continue-on-error: true
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f notified_deals.json bot_stats.json 2>/dev/null || true
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Update cache [skip ci]"
        git push || true
